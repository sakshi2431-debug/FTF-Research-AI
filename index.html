<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Assistiv - Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1d2433;
    --ink-2: #4a5263;
    --muted: #5d6576;
    --line: #dfe3ee;
    --blue: #1570EF;
    --blue-soft: #EFF8FF;
    --card: rgba(255, 255, 255, 0.72);
    --green-ink: #0d6b3a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(520px 520px at 12% 38%, rgba(196, 202, 246, 0.55), transparent 70%),
      radial-gradient(600px 420px at 88% 95%, rgba(205, 210, 252, 0.6), transparent 70%),
      radial-gradient(500px 400px at 75% 10%, rgba(236, 240, 255, 0.8), transparent 70%),
      linear-gradient(180deg, #f6f7fd 0%, #f3f4fc 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    height: 100vh; height: 100dvh;
    overflow: hidden;
  }
  /* Fixed design canvas matching the mockup (1654 × 1380), scaled to fit the window */
  .stage {
    position: absolute; left: 0; top: 0;
    width: 1654px; height: 1380px;
    transform-origin: 0 0;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

  /* ---------- Header (from Figma: Assistiv – Instructors, 1376px frame) ----------
     Values below are Figma px; `zoom` maps the 1376px frame onto this 1654px canvas. */
  header {
    zoom: 1.2;
    height: 88px;
    padding: 32px 32px 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }
  .brand { display: inline-flex; align-items: center; justify-self: start; border-radius: 10px; }
  .brand svg { display: block; }
  nav.tabs {
    height: 56px;
    display: flex; align-items: center; gap: 18px;
    padding: 0 8px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 100px 200px rgba(10, 13, 18, .18);
  }
  nav.tabs button {
    height: 40px; padding: 0 13px; border-radius: 8px;
    font-size: 16px; font-weight: 400; line-height: 1; color: #757575;
    transition: background .2s, color .2s;
  }
  nav.tabs button:hover { background: #f5f6f8; color: #414651; }
  nav.tabs button.active { background: #EFF8FF; color: #1570EF; font-weight: 600; }
  .util { display: flex; justify-content: flex-end; align-items: center; gap: 23px; }
  .util button {
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 2px; border-radius: 8px;
    font-size: 15px; font-weight: 500; color: #535862;
    transition: color .2s;
  }
  .util button svg { width: 20px; height: 20px; flex: none; }
  .util button:hover { color: #1570EF; }
  .util button:hover svg path { stroke: currentColor; }
  .util .avatar {
    width: 32px; height: 32px; padding: 0; margin-left: -5px;
    border-radius: 50%; justify-content: center;
    background: #EFF8FF; color: #1570EF; font-size: 15px; font-weight: 600;
  }
  .util .avatar:hover { box-shadow: 0 0 0 3px rgba(21, 112, 239, .15); }

  /* ---------- Main ---------- */
  main { width: 842px; margin: 0 auto; padding: 44px 0 0; }
  h1 { font-size: 36px; font-weight: 500; margin: 0; letter-spacing: -0.3px; line-height: 44px; }
  .sub { font-size: 18px; color: var(--ink-2); margin: 4px 0 24px; }

  .grid { display: grid; grid-template-columns: 410px 410px; grid-template-rows: 382px 380px; gap: 24px 22px; }
  .card {
    position: relative; text-align: left;
    background: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.82) 100%);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 0 18px 18px;
    display: flex; flex-direction: column;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s;
    outline: none;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    border-color: #c9d6f3;
    box-shadow: 0 18px 40px -18px rgba(60, 80, 160, .35);
  }
  .card:focus-visible { box-shadow: 0 0 0 3px rgba(31,111,229,.35); }
  .card:active { transform: translateY(-1px) scale(.995); }
  .card.selected { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(31,111,229,.18); }
  .art { height: 282px; flex: none; margin: 0 -18px; display: block; overflow: visible; }
  .art svg { width: 100%; height: 100%; overflow: visible; }
  .card h3 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
  .card p { margin: 0; font-size: 15.5px; line-height: 1.5; color: var(--muted); }

  /* illustration motion */
  .float { transition: transform .5s cubic-bezier(.2,.8,.2,1); transform-box: fill-box; transform-origin: center; }
  .card:hover .f-up { transform: translateY(-6px); }
  .card:hover .f-up2 { transform: translateY(-3px) rotate(-2deg); }
  .card:hover .f-spin { transform: rotate(18deg) scale(1.08); }
  .card:hover .f-fan1 { transform: translate(6px, -2px) rotate(4deg); }
  .card:hover .f-fan2 { transform: translate(12px, 2px) rotate(8deg); }
  .card:hover .f-fan3 { transform: translate(-4px, -4px) rotate(-3deg); }
  .card:hover .f-front { transform: translate(-6px, -4px) rotate(-3deg); }
  .card:hover .spark line { animation: spark .9s ease; }
  @keyframes spark { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  .bar { transform-box: fill-box; transform-origin: center; }
  .card:hover .bar, .voice-live .bar { animation: wave 1s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.45); } }
  .mic-pulse { transform-box: fill-box; transform-origin: center; opacity: 0; }
  .voice-live .mic-pulse { animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .45; } 100% { transform: scale(1.5); opacity: 0; } }
  .radio-sel { transition: transform .3s; transform-box: fill-box; }
  .card:hover .radio-sel { transform: translateY(-24px); }

  /* ---------- Composer ---------- */
  .dock { margin-top: 66px; }
  .banner {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 22px 18px;
    margin-bottom: -8px;
    border-radius: 14px 14px 0 0;
    background: linear-gradient(180deg, #e9f8ee 0%, #d8f3e2 100%);
    color: var(--green-ink); font-size: 17px;
    transition: opacity .25s, transform .25s, max-height .3s, padding .3s, margin .3s;
    max-height: 70px; overflow: hidden;
  }
  .banner b { font-weight: 500; }
  .banner .close { margin-left: auto; color: #11935a; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; }
  .banner .close:hover { background: rgba(17,147,90,.12); }
  .banner.gone { opacity: 0; transform: translateY(8px); max-height: 0; padding-block: 0; margin-bottom: 0; }
  .composer {
    position: relative;
    background: #fff; border: 1px solid #dde2ec; border-radius: 14px;
    padding: 18px 16px 14px 25px;
    box-shadow: 0 6px 22px -14px rgba(40, 60, 120, .25);
    transition: border-color .2s, box-shadow .2s;
  }
  .composer:focus-within { border-color: #b7cdf5; box-shadow: 0 0 0 4px rgba(31,111,229,.08), 0 6px 22px -14px rgba(40,60,120,.25); }
  .composer textarea {
    width: 100%; border: 0; outline: 0; resize: none;
    font: inherit; font-size: 19px; color: var(--ink); line-height: 1.4;
    min-height: 30px; max-height: 180px; padding: 0; background: transparent;
  }
  .composer textarea::placeholder { color: #727a8a; }
  .composer .row { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
  .lib-toggle {
    display: flex; align-items: center; gap: 12px; font-size: 16.5px; color: #2b3242;
    padding: 4px 8px 4px 0; border-radius: 8px;
  }
  .lib-toggle .k { font-size: 15px; width: 18px; text-align: center; }
  .lib-toggle .check { display: none; color: var(--blue); }
  .lib-toggle[aria-pressed="true"] { color: var(--blue); }
  .lib-toggle[aria-pressed="true"] .k { display: none; }
  .lib-toggle[aria-pressed="true"] .check { display: inline; }
  .send {
    width: 42px; height: 42px; border-radius: 8px;
    background: var(--blue); color: #fff; display: grid; place-items: center;
    transition: background .2s, transform .15s, opacity .2s;
  }
  .send:hover { background: #185fd0; }
  .send:active { transform: scale(.94); }
  .send:disabled { opacity: .55; cursor: default; }
  .chips { display: flex; gap: 14px; margin-top: 18px; }
  .chip {
    padding: 7px 14px; border-radius: 999px;
    background: #e6eefb; color: #1757c2; font-size: 16px; font-weight: 500;
    transition: background .2s, transform .15s;
  }
  .chip:hover { background: #d7e5fb; }
  .chip:active { transform: scale(.96); }

  /* ---------- Chat view ---------- */
  .chat-top, .thread, .panel, .row.chat, .disclaimer { display: none; }
  body.chatting { background: #f9fafb; }
  body.chatting main {
    width: auto; height: 1274px; margin: 0;
    padding: 4px 22px 30px 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 540px;
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "top panel" "thread panel" "dock panel";
  }
  body.chatting main > h1, body.chatting .sub, body.chatting .grid,
  body.chatting .banner, body.chatting .chips { display: none; }
  body.chatting .chat-top { display: flex; grid-area: top; width: min(1380px, calc(100% - 96px)); justify-self: center; }
  body.chatting .thread { display: flex; grid-area: thread; }
  body.chatting .dock { grid-area: dock; margin-top: 6px; width: min(1380px, calc(100% - 96px)); justify-self: center; position: relative; }
  body.chatting .panel { display: block; grid-area: panel; align-self: start; }
  body.chatting .disclaimer { display: block; }

  .back {
    display: inline-flex; align-items: center; gap: 10px;
    height: 56px; padding: 0 20px 0 14px; margin-left: -14px;
    font-size: 21px; font-weight: 500; color: #3a4152;
    border-radius: 14px; transition: color .2s, background .2s;
  }
  .back svg { width: 24px; height: 24px; }
  .back:hover { color: var(--blue); background: #eef2f9; }

  /* Visible keyboard focus everywhere */
  button:focus-visible, [role="button"]:focus-visible, a:focus-visible {
    outline: 3px solid rgba(31, 111, 229, .55); outline-offset: 2px;
  }

  .thread {
    flex-direction: column; overflow-y: auto;
    padding: 36px 48px 80px;
    scrollbar-width: thin; scrollbar-color: #d5d9e4 transparent;
  }
  .thread-inner { width: 100%; max-width: 1380px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
  .msg { animation: in .35s ease both; }

  /* user message */
  .msg.me-row { align-self: flex-end; max-width: 72%; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .bubble {
    background: #e6effc; color: var(--ink);
    padding: 26px 30px; border-radius: 32px;
    font-size: 24px; line-height: 1.65; white-space: pre-wrap;
  }
  .bubble .files { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; white-space: normal; }
  .bubble .files span { font-size: 16px; background: #fff; border-radius: 8px; padding: 4px 10px; color: var(--muted); }
  .me-copy { margin-right: 14px; }

  /* assistant message */
  .msg.ai { align-self: stretch; color: #1a1f2b; font-size: 24px; line-height: 1.72; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 22px; color: #5d6576; margin-bottom: 18px; padding: 4px 0; border-radius: 8px; }
  .status .t { color: #6b7280; }
  .status .chev { display: none; transition: transform .2s; }
  .msg.ai.done .status { cursor: pointer; }
  .msg.ai.done .status:hover { color: var(--ink-2); }
  .msg.ai.done .status .chev { display: inline-block; }
  .status[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .steps { margin: -6px 0 22px; padding: 4px 0 4px 18px; border-left: 2px solid #e3e7ef; font-size: 20px; color: #5d6576; line-height: 1.9; }
  .shimmer {
    margin-top: 18px; font-size: 21px; width: fit-content;
    background: linear-gradient(90deg, #5d6576 0%, #5d6576 35%, #c9ced9 50%, #5d6576 65%, #5d6576 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 1.8s linear infinite;
  }
  @keyframes shimmer { from { background-position: 110% 0; } to { background-position: -110% 0; } }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .body p { margin: 0 0 22px; }
  .body p:last-child { margin-bottom: 0; }
  .body h4 { margin: 30px 0 12px; font-size: 24px; font-weight: 600; }
  .body ol, .body ul { margin: 0 0 22px; padding-left: 30px; }
  .body li { margin: 8px 0; padding-left: 4px; }
  .body strong { font-weight: 600; }
  .body a.cite { color: var(--blue); text-decoration: none; }
  .body a.cite:hover { text-decoration: underline; }
  .body code.inline { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .86em; background: #eef1f8; color: #1757c2; padding: 2px 7px; border-radius: 6px; }
  .body.live > p:last-child::after,
  .body.live > ol:last-child > li:last-child::after,
  .body.live > ul:last-child > li:last-child::after {
    content: ""; display: inline-block; width: 11px; height: 11px; margin-left: 6px; border-radius: 50%;
    background: var(--blue); vertical-align: middle; animation: caret .7s ease-in-out infinite alternate;
  }
  @keyframes caret { from { opacity: .3; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
  .act {
    height: 56px; min-width: 56px; padding: 0 20px; border-radius: 14px;
    border: 1px solid #dfe3ec; background: #fff; color: #3a4152;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 20px; font-weight: 500;
    transition: background .2s, border-color .2s, color .2s;
  }
  .act svg { width: 24px; height: 24px; flex: none; }
  .act:hover { background: #f3f7fe; border-color: #b7cdf5; color: var(--blue); }
  .act.ok { color: #0d7a45; border-color: #bfe6cf; background: #f0faf4; }
  .act.me-copy { border-color: transparent; background: transparent; padding: 0; }
  .act.me-copy:hover { background: #eef2f9; }

  /* ---------- Code blocks (light, Assistiv) ---------- */
  .code { margin: 24px 0 28px; border-radius: 24px; overflow: hidden; background: #f3f5f9; border: 1px solid #e3e7ef; }
  .code-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 4px 26px; color: var(--ink); font-size: 19px; font-weight: 500; }
  .code-lang { display: inline-flex; align-items: center; gap: 12px; }
  .code-lang svg { color: #4a5263; }
  .code-tools { display: flex; align-items: center; gap: 6px; }
  .code-btn { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; color: #4a5263; transition: background .2s, color .2s; }
  .code-btn:hover { background: #e6eaf2; color: var(--ink); }
  .code-btn.ok { color: #0d7a45; }
  .code-run {
    display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; margin-left: 4px;
    border-radius: 999px; border: 1px solid #d9dee8; background: #fff; color: var(--ink); font-size: 18px; font-weight: 500;
    transition: background .2s, border-color .2s, color .2s;
  }
  .code-run:hover { background: #f3f7fe; border-color: #b7cdf5; color: var(--blue); }
  .code-run.running { color: var(--blue); }
  .code pre { margin: 0; padding: 16px 28px 28px; overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 20px; line-height: 1.65; color: #1d2433; }
  .tk-k { color: #1f5fd1; } .tk-s { color: #157f3b; } .tk-c { color: #6b7280; font-style: italic; } .tk-f { color: #6d28d9; } .tk-n { color: #b4410d; } .tk-v { color: #6d28d9; }
  .code-out { border-top: 1px solid #e3e7ef; background: #fff; padding: 16px 28px 22px; animation: in .3s ease; }
  .code-out-label { font-size: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #5d6576; margin-bottom: 6px; }
  .code-out pre { padding: 0; font-size: 19px; }
  .code-out .note { font-size: 18px; color: #5d6576; }
  .code.expanded {
    position: fixed; inset: 60px 140px; z-index: 60; margin: 0;
    display: flex; flex-direction: column; background: #f3f5f9;
    box-shadow: 0 40px 120px -20px rgba(20, 30, 70, .45);
  }
  .code.expanded pre { flex: 1; overflow: auto; font-size: 24px; }
  .code-backdrop { position: fixed; inset: 0; z-index: 59; background: rgba(20, 26, 40, .35); }

  /* ---------- Voice mode ---------- */
  .orb-wrap { display: none; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0 6px; }
  body.voice .orb-wrap { display: flex; order: 0; }
  .orb {
    --lvl: 0;
    position: relative; width: 300px; height: 228px; padding: 0; border: 0; background: none; border-radius: 50%;
    transform: scale(calc(1 + var(--lvl) * .3));
    transition: transform .1s linear, filter .6s ease, opacity .6s ease;
    cursor: default;
  }
  .orb[data-state="speaking"], .orb[data-state="thinking"] { cursor: pointer; }
  .orb-inner { position: absolute; inset: 0; }
  .orb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; }
  .orb .o1 { animation: drift1 9s ease-in-out infinite; }
  .orb .o2 { opacity: .75; animation: drift2 12s ease-in-out infinite; }
  .orb .o3 { opacity: .5; filter: hue-rotate(28deg) saturate(1.2); animation: drift3 15s ease-in-out infinite; }
  @keyframes drift1 { 0%, 100% { transform: rotate(0) scale(1) translate(0, 0); } 33% { transform: rotate(14deg) scale(1.06) translate(4%, -3%); } 66% { transform: rotate(-10deg) scale(.95) translate(-4%, 3%); } }
  @keyframes drift2 { 0%, 100% { transform: scaleX(-1) rotate(0) translate(0, 0); } 50% { transform: scaleX(-1) rotate(-22deg) scale(1.08) translate(-5%, 2%); } }
  @keyframes drift3 { 0%, 100% { transform: rotate(180deg) scale(.9); } 50% { transform: rotate(150deg) scale(1.05) translate(3%, 4%); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes listen { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .orb[data-state="listening"] .orb-inner, .orb[data-state="hearing"] .orb-inner { animation: listen 2.6s ease-in-out infinite; }
  .orb[data-state="speaking"] .orb-inner { animation: breathe 1.1s ease-in-out infinite; }
  .orb[data-state="speaking"] img { animation-duration: 4s, 5s, 6s; }
  .orb[data-state="speaking"] .o1 { animation-duration: 4s; }
  .orb[data-state="speaking"] .o2 { animation-duration: 5s; }
  .orb[data-state="speaking"] .o3 { animation-duration: 6s; }
  .orb[data-state="thinking"] { filter: saturate(.55) brightness(1.08); opacity: .8; }
  .orb[data-state="thinking"] .o1 { animation-duration: 3s; }
  .orb[data-state="muted"], .orb[data-state="unsupported"], .orb[data-state="denied"] { filter: grayscale(.85); opacity: .55; }
  .orb[data-state="muted"] img, .orb[data-state="unsupported"] img, .orb[data-state="denied"] img { animation-play-state: paused; }
  .orb:focus-visible { outline: 3px solid rgba(31, 111, 229, .5); outline-offset: 6px; }
  .orb-label { font-size: 19px; font-weight: 500; color: #4a5263; min-height: 26px; max-width: 900px; text-align: center; }
  .interim { color: #6b7a99; }

  body.voice .dock { display: flex; flex-direction: column; }
  body.voice .disclaimer { order: 1; margin: 2px 0 14px; }
  body.voice .composer { order: 2; display: flex; align-items: center; gap: 10px; padding: 12px 14px 12px 16px; border-radius: 999px; }
  body.voice .row.chat, body.voice .right-tools { display: contents; }
  body.voice #attachBtn { order: -1; }
  body.voice .composer textarea { order: 0; flex: 1; min-width: 0; font-size: 22px; }
  body.voice .source-wrap { order: 1; }
  body.voice #micBtn, body.voice #sendChat, body.voice .attachments { display: none; }
  .v-btn { display: none; }
  body.voice .v-btn { display: grid; place-items: center; width: 60px; height: 60px; border-radius: 50%; transition: background .2s, color .2s, transform .15s; }
  body.voice .v-btn:active { transform: scale(.94); }
  .v-mute { order: 2; background: #eef0f5; color: #3a4152; }
  .v-mute:hover { background: #e3e7ef; }
  .v-mute .i-off { display: none; }
  .v-mute[aria-pressed="true"] { background: #fdecec; color: #b42318; }
  .v-mute[aria-pressed="true"] .i-on { display: none; }
  .v-mute[aria-pressed="true"] .i-off { display: block; }
  .v-end { order: 3; background: var(--blue); color: #fff; }
  .v-end:hover { background: #185fd0; }

  /* spoken messages + live transcription */
  .msg.ai.spoken .spoken-body p { margin: 0; }
  .w { transition: color .45s ease; }
  .w.fresh { color: #a3a9b5; }
  .cut-note { display: inline-block; margin-left: 10px; padding: 2px 10px; border-radius: 999px; background: #f1f3f7; color: #5d6576; font-size: 16px; vertical-align: 3px; }

  /* Quiz — one question at a time */

  .q-label { font-size: 17px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #5d6576; }

  .q-hint { margin: 0 0 24px; font-size: 19px; color: #4a5263; }

  .q-code .tk-f { color: #7cb7ff; } .q-code .tk-n { color: #ffb86b; } .q-code .tk-v { color: #e8eaf0; }

  .opts { display: flex; flex-direction: column; gap: 14px; }

    cursor: pointer; transition: border-color .15s, background .15s, box-shadow .15s;
  }

  }

  .ans-input {

  }

  .feedback { margin-top: 18px; padding: 16px 20px; border-radius: 12px; font-size: 20px; line-height: 1.55; }
  .feedback b { font-weight: 600; }
  .feedback.ok { background: #ecfbf2; color: #0d6b3a; }
  .feedback.bad { background: #fdf0f0; color: #9b2119; }
  .feedback.info { background: #eef4fd; color: #1d4f9c; }

  /* Shared quiz/flashcard navigation */
  .qz-foot, .fc-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 34px; }

  /* Quiz results */
  .qz-score { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; }
  .qz-big { font-size: 64px; font-weight: 800; letter-spacing: -.02em; color: #111827; }
  .qz-big span { margin-left: 6px; font-size: 30px; font-weight: 600; color: #5d6576; }

    width: 100%; text-align: left; display: flex; align-items: center; gap: 16px;

  .qz-item small { font-size: 16px; color: #5d6576; white-space: nowrap; }

  /* Flashcards */
  .fc { padding: 28px 30px 30px; }

  .fc-stage { position: relative; height: 600px; perspective: 2200px; }

  .fc-q { font-size: 46px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; color: var(--ink); max-width: 1000px; }
  .fc-a { font-size: 32px; font-weight: 500; line-height: 1.45; color: var(--ink); max-width: 1000px; }
  .fc-ex { font-size: 22px; line-height: 1.5; color: #4a5263; max-width: 900px; }
  .fc-hint { display: inline-flex; align-items: center; gap: 10px; font-size: 21px; color: #5d6576; margin-top: 6px; }
  .fc-done {
    position: absolute; inset: 0; border-radius: 28px; background: #f4f5f7;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;
    animation: in .35s ease;

  .fc-done h4 { margin: 0; font-size: 38px; font-weight: 700; color: var(--ink); }
  .fc-done p { margin: 0; font-size: 22px; color: #4a5263; }

  /* scroll to bottom */
  .scroll-down {

  .send-circle { width: 62px; height: 62px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; transition: background .2s, transform .15s; }

  .menu {
    position: absolute; bottom: calc(100% + 10px); right: 0; min-width: 290px; z-index: 5;
    background: #fff; border: 1px solid #e3e7ef; border-radius: 18px; padding: 6px;
    box-shadow: 0 20px 44px -18px rgba(40, 60, 120, .35);

  .att button:hover { background: #e2e7f2; }

  .disclaimer a { color: var(--ink-2); text-underline-offset: 3px; }

  /* right panel: Sources */
  .panel {
    margin-top: 14px;
    background: #fff; border: 1px solid #e7e9ef; border-radius: 28px;
    box-shadow: 0 10px 30px -22px rgba(30, 40, 80, .3);
    padding: 30px 36px 32px;
  }
  .p-head { display: flex; align-items: center; justify-content: space-between; font-size: 22px; color: #4b5260; }
  .p-plus { width: 38px; height: 38px; margin-right: -9px; border-radius: 10px; display: grid; place-items: center; color: #6b7280; transition: background .2s, color .2s; }

  .p-body { margin-top: 16px; font-size: 20px; color: #5d6576; line-height: 1.5; }
  .src { width: calc(100% + 20px); text-align: left; display: flex; align-items: center; gap: 14px; padding: 10px 10px; margin: 0 -10px; border-radius: 14px; animation: in .3s ease both; transition: background .3s; }

  .src-ic { width: 34px; height: 34px; border-radius: 9px; background: #f1f4fa; color: #5d6576; display: grid; place-items: center; flex: none; font-size: 13px; font-weight: 600; }
  .src-txt { flex: 1; min-width: 0; }
  .src b { display: block; color: #2b3242; font-weight: 400; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src-txt { display: block; }
  .src-txt > span { display: block; font-size: 18px; color: #5d6576; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: #1d2433; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const prompt = $('#prompt');
  const thread = $('#thread');
  const toastEl = $('#toast');
  let saveToLibrary = false;
  let toastTimer;

  // Scale the 1380px-tall design to fit the window height (no scroll) and
  // stretch the canvas to the full window width, so there are no side bands.
  const stage = $('#stage');
  const fit = () => {
    const w = window.innerWidth, h = window.innerHeight;
    const s = Math.min(h / 1380, w / 1100); // keep the content column visible on narrow windows
    const stageW = Math.max(w / s, 1100);
    stage.style.width = stageW + 'px';
    stage.style.left = Math.max(0, (w - stageW * s) / 2) + 'px';
    stage.style.top = Math.max(0, (h - 1380 * s) / 2) + 'px';
    stage.style.transform = `scale(${s})`;
  };
  window.addEventListener('resize', fit);
  fit();

  const toast = (msg) => {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  };

  // Waveform bars
  const NS = 'http://www.w3.org/2000/svg';
  const hL = [18, 36, 64, 96, 118, 92, 66, 38];
  const hR = [42, 70, 96, 118, 96, 64, 36, 18];
  const drawBars = (g, heights, x0) => heights.forEach((h, i) => {
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('class', 'bar');
    r.setAttribute('x', x0 + i * 13.5);
    r.setAttribute('y', 144 - h / 2);
    r.setAttribute('width', 6);
    r.setAttribute('height', h);
    r.setAttribute('rx', 3);
    r.setAttribute('fill', 'url(#bar)');
    r.style.animationDelay = `${(i % 4) * 0.12}s`;
    g.appendChild(r);
  });
  drawBars($('#barsL'), hL, 28);
  drawBars($('#barsR'), hR, 274);

  // Tabs
  $$('nav.tabs button').forEach(btn => btn.addEventListener('click', () => {
    $$('nav.tabs button').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
    btn.classList.add('active'); btn.setAttribute('aria-selected', 'true');
    if (btn.textContent.trim() === 'Study') exitChat();
    else toast(`${btn.textContent.trim()} — coming soon`);
  }));

  $$('[data-toast]').forEach(b => b.addEventListener('click', () => toast(b.dataset.toast)));

  // Textarea autosize
  const autosize = () => { prompt.style.height = 'auto'; prompt.style.height = prompt.scrollHeight + 'px'; };
  prompt.addEventListener('input', autosize);

  const fill = (text, placeholder) => {
    prompt.value = text;
    if (placeholder) prompt.placeholder = placeholder;
    autosize();
    prompt.focus();
    prompt.setSelectionRange(text.length, text.length);
  };

  // Mode cards
  const modes = {
    ask:   { text: '', ph: 'Ask Aurora anything...' },
    quiz:  { text: 'Create a quiz on ', ph: 'What topic should the quiz cover?' },
    flash: { text: 'Build flashcards for ', ph: 'Paste notes or name a topic...' },
  };
  let voiceOn = false;
  $$('.card').forEach(card => card.addEventListener('click', () => {
    const mode = card.dataset.mode;
    $$('.card').forEach(c => c.classList.toggle('selected', c === card && mode !== 'ask'));
    if (mode === 'voice') { startVoice(); return; }
    const m = modes[mode];
    fill(m.text, m.ph);
  }));

  // Chips
  $$('.chip').forEach(c => c.addEventListener('click', () => fill(c.dataset.fill)));

  // Banner
  $('#closeBanner').addEventListener('click', () => $('#banner').classList.add('gone'));

  // Library toggle
  $('#libToggle').addEventListener('click', (e) => {
    saveToLibrary = !saveToLibrary;
    e.currentTarget.setAttribute('aria-pressed', saveToLibrary);
    $('#libLabel').textContent = saveToLibrary ? 'Saving to Library' : 'Save your learning to Library';
  });
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); $('#libToggle').click(); }
  });

  // ---------- Chat ----------
  const inner = $('#threadInner');
  const esc = (s) => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  const ICON = {
    copy: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
    check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
    regen: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>',
    note: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 14h6M12 11v6"/></svg>',
    expand: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>',
    collapse: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>',
    codeTag: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>',
    play: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 4.5v15l12-7.5z"/></svg>',
    chev: '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  };

  // Python-ish syntax highlighting
  const KW = 'from|import|as|def|return|for|in|if|elif|else|while|with|class|try|except|lambda|and|or|not|None|True|False';
  const TOKEN = new RegExp(`(#[^\\n]*)|([fr]?"[^"\\n]*"?|[fr]?'[^'\\n]*'?)|\\b(${KW})\\b|\\b([A-Za-z_]\\w*)(?=\\()|\\b(\\d+(?:\\.\\d+)?)\\b|\\b([A-Za-z_]\\w*)\\b`, 'g');
  const highlight = (code) => {
    let out = '', last = 0, m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(code))) {
      out += esc(code.slice(last, m.index));
      const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'k' : m[4] ? 'f' : m[5] ? 'n' : 'v';
      out += `<span class="tk-${cls}">${esc(m[0])}</span>`;
      last = TOKEN.lastIndex;
    }
    return out + esc(code.slice(last));
  };

  // Tiny markdown renderer: paragraphs, ### headings, lists, **bold**, `code`, [cite](src:N), ``` fences
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, '<code class="inline">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(src:(\d+)\)/g, '<a href="#" class="cite" data-src="$2">$1</a>');
  const codeBlock = (code, lang) => {
    const l = (lang || '').toLowerCase();
    const isPy = l === 'python' || l === 'py';
    const label = isPy ? 'Python' : (!l || l === 'text' || l === 'output') ? 'Plain text' : l[0].toUpperCase() + l.slice(1);
    return `<div class="code" data-lang="${esc(l)}"><div class="code-head"><span class="code-lang">${ICON.codeTag}${esc(label)}</span><span class="code-tools">` +
      `<button type="button" class="code-btn code-expand" aria-label="Expand code" title="Expand">${ICON.expand}</button>` +
      `<button type="button" class="code-btn copy" aria-label="Copy code" title="Copy">${ICON.copy}</button>` +
      (isPy ? `<button type="button" class="code-run">${ICON.play}<span>Run</span></button>` : '') +
      `</span></div><pre><code>${isPy ? highlight(code) : esc(code)}</code></pre></div>`;
  };
  const render = (md) => {
    const lines = md.split('\n');
    let html = '', para = [], list = null, i = 0;
    const flushP = () => { if (para.length) { html += `<p>${inline(para.join(' '))}</p>`; para = []; } };
    const flushL = () => { if (list) { html += `<${list.t}>${list.items.map(x => `<li>${inline(x)}</li>`).join('')}</${list.t}>`; list = null; } };
    while (i < lines.length) {
      const line = lines[i];
      const fence = line.match(/^```(\w*)/);
      if (fence) {
        flushP(); flushL();
        const lang = fence[1] ? fence[1][0].toUpperCase() + fence[1].slice(1) : 'Code';
        const buf = []; i++;
        while (i < lines.length && !lines[i].startsWith('```')) buf.push(lines[i++]);
        i++;
        html += codeBlock(buf.join('\n'), fence[1]);
        continue;
      }
      const h = line.match(/^###\s+(.*)/);
      if (h) { flushP(); flushL(); html += `<h4>${inline(h[1])}</h4>`; i++; continue; }
      const ol = line.match(/^\s*\d+\.\s+(.*)/), ul = line.match(/^\s*[-*]\s+(.*)/);
      if (ol || ul) {
        flushP();
        const t = ol ? 'ol' : 'ul';
        if (!list || list.t !== t) { flushL(); list = { t, items: [] }; }
        list.items.push((ol || ul)[1]); i++; continue;
      }
      if (!line.trim()) { flushP(); flushL(); i++; continue; }
      flushL(); para.push(line); i++;
    }
    flushP(); flushL();
    return html;
  };

  // ---------- Interactive widgets: quiz + flashcards ----------
  let widgetUid = 0;
  const W_ICON = {

  // Question banks (demo content — no model is connected)
  const isUX = (topic) => !topic || /\bux\b|product design|user experience|usability/i.test(topic);
  const titleCase = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const isPy = (topic) => /\b(python|coding|programming|code|variables?)\b/i.test(topic || '');
  const PY_QUIZ = {
    title: 'Python Basics Quiz',
    questions: [
      { type: 'mc', q: 'What does this program print when you run it?',
        hint: 'Read the code from top to bottom, then select the output.',
        code: { file: 'lesson1.py', lang: 'Python 3', src: 'name = "Ava"\nage = 25\n\nage = age + 1\n\nprint("Next year, I will be", age)' },
        options: ['Next year, I will be 26', 'Next year, I will be 25', 'Next year, I will be age', 'It raises an error'], answer: [0],
        why: '`age = age + 1` replaces 25 with 26 before the print line runs, and print separates its arguments with a space.' },
      { type: 'mc', q: 'What happens when you run this code?',
        hint: 'Look closely at the capital letters.',
        code: { file: 'names.py', lang: 'Python 3', src: 'Name = "Ava"\nprint(name)' },
        options: ['It prints Ava', 'It raises a NameError because name is not defined', 'It prints Name', 'It prints nothing'], answer: [1],
        why: 'Python is case-sensitive: Name and name are different variables, and name was never assigned.' },
      { type: 'multi', q: 'Which of these lines correctly store text in a variable?',
        options: ['city = "New York"', "city = 'New York'", 'city = New York', '"city" = New York'], answer: [0, 1],
        why: 'Text must be inside matching quotes (single or double), and the variable name goes on the left without quotes.' },
      { type: 'short', q: 'Which built-in function displays output in the terminal?',
        keywords: ['print'], model: 'print()' },
      { type: 'long', q: 'Explain why "Ava" needs quotation marks in Python but 25 does not.',
        rubric: [
          { label: 'Says "Ava" is text (a string)', kw: ['text', 'string', 'str'] },
          { label: 'Says 25 is a number', kw: ['number', 'int', 'integer', 'numeric'] },
          { label: 'Explains what the quotes tell Python', kw: ['quote', 'quotation', 'literal', 'not a variable', 'treat'] },
          { label: 'Mentions what happens without quotes', kw: ['error', 'variable name', 'nameerror', 'look for', 'undefined'] },
        ] },
    ],

  const quizFor = (topic) => isPy(topic) ? PY_QUIZ : isUX(topic) ? {
    title: 'UX & Product Design Quiz',
    questions: [
      { type: 'mc', q: 'Which UX principle helps reduce cognitive load by showing users only the information they need at each stage?',
        options: ['Progressive disclosure', 'Recognition over recall', 'Visual hierarchy', 'Error prevention'], answer: [0],
        why: 'Progressive disclosure reveals information and features gradually, only when users need them.' },
      { type: 'multi', q: 'Which of the following are effective ways to evaluate a new onboarding flow? Select all that apply.',
        options: ['Measure task completion time', 'Conduct usability testing', 'Track drop-off rates', 'Add more onboarding steps'], answer: [0, 1, 2],
        why: 'Time on task, usability testing and drop-off rates all measure how well onboarding works. Adding steps is a design change, not a way to evaluate.' },
      { type: 'mc', q: 'In a usability test, what does the think-aloud protocol ask participants to do?',
        options: ['Say what they are thinking while completing tasks', 'Rate the design after the session', 'Sketch their ideal layout', 'Compare two prototypes silently'], answer: [0],
        why: 'Thinking aloud exposes expectations and confusion in the moment, which you cannot see from clicks alone.' },
      { type: 'short', q: 'Which of Nielsen’s heuristics says an interface should use words and concepts that are familiar to the user?',
        keywords: ['match', 'real world'], model: 'Match between system and the real world' },
      { type: 'long', q: 'A checkout flow has a high abandonment rate. Describe how you would investigate the problem and redesign it.',
        rubric: [
          { label: 'Names a research method', kw: ['interview', 'usability', 'test', 'analytics', 'survey', 'session', 'heatmap', 'funnel'] },
          { label: 'Identifies a metric to track', kw: ['conversion', 'abandon', 'drop', 'completion', 'rate', 'time'] },
          { label: 'Proposes a concrete design change', kw: ['remove', 'reduce', 'simplif', 'guest', 'progress', 'autofill', 'field', 'step'] },
          { label: 'Plans to validate or iterate', kw: ['iterate', 'a/b', 'ab test', 'retest', 'validate', 'measure', 'experiment'] },
        ] },
    ],
  } : {
    title: `${titleCase(topic)} Quiz`,
    questions: [
      { type: 'mc', q: `When studying ${topic}, which approach builds the most durable understanding?`,
        options: ['Explaining it in your own words', 'Re-reading the slides several times', 'Highlighting key terms', 'Memorizing definitions word for word'], answer: [0],
        why: 'Putting ideas in your own words forces you to connect them, which is what makes them stick.' },
      { type: 'multi', q: `Which of these are good ways to check your understanding of ${topic}? Select all that apply.`,
        options: ['Teach it to a classmate', 'Do practice problems without notes', 'Connect it to an earlier unit', 'Skim the summary once'], answer: [0, 1, 2],
        why: 'Teaching, retrieval practice and making connections all test real understanding. Skimming only feels productive.' },
      { type: 'mc', q: `You get a ${topic} question wrong on a practice quiz. What is the most useful next step?`,
        options: ['Work out why, then retry it later', 'Move on to the next topic', 'Memorize the correct answer', 'Skip similar questions'], answer: [0],
        why: 'Understanding the mistake and retrying after a gap turns an error into learning.' },
      { type: 'short', q: `In one sentence, what problem or question does ${topic} address?`,
        keywords: [], model: 'Compare your sentence with the opening slide of Lecture 4.' },
      { type: 'long', q: `Explain ${topic} to a classmate who missed the lecture. Include an example.`,
        rubric: [
          { label: 'Defines the core idea', kw: ['is', 'means', 'refers', 'defined'] },
          { label: 'Gives an example', kw: ['example', 'for instance', 'such as', 'like'] },
          { label: 'Explains why it matters', kw: ['because', 'matters', 'important', 'so that', 'helps'] },
          { label: 'Connects to something else you know', kw: ['similar', 'unlike', 'compared', 'related', 'connect'] },
        ] },
    ],
  };
  const flashFor = (topic) => isUX(topic) ? {
    title: 'UX Flashcards',
    cards: [
      { q: 'What is progressive disclosure in UX design?', a: 'Revealing information and features gradually, only when users need them, to reduce cognitive load.', ex: 'An “Advanced settings” section that stays collapsed until opened.' },
      { q: 'What does “recognition over recall” mean?', a: 'Make options and information visible so users can recognize them instead of having to remember them.', ex: 'Showing recent searches in a search box.' },
      { q: 'What is a usability heuristic?', a: 'A broad rule of thumb for interface design, used to spot usability problems quickly.', ex: 'Nielsen’s 10 heuristics, such as “visibility of system status”.' },
      { q: 'How is UX different from UI?', a: 'UX is the whole experience and flow of using a product; UI is the visual and interactive surface people touch.', ex: 'A beautiful checkout page (UI) can still have a confusing flow (UX).' },
      { q: 'Why test with only about five users per round?', a: 'Five users usually uncover most major usability issues, so it is better to fix them and test again in rounds.', ex: 'Three rounds of five users beat one round of fifteen.' },
    ],
  } : {
    title: `${titleCase(topic)} Flashcards`,
    cards: [
      { q: `What is ${topic}?`, a: 'Write a one-line definition in your own words, then compare it with Lecture 4, slide 12.', ex: '' },
      { q: `Why does ${topic} matter?`, a: 'Name the problem it solves or the question it answers.', ex: '' },
      { q: `What are the key terms in ${topic}?`, a: 'List the 3–4 terms your lecture uses most, and define each.', ex: '' },
      { q: `Give an example of ${topic}.`, a: 'Use the worked example from the Unit 2 study guide, then invent one of your own.', ex: '' },
      { q: `What is a common mistake with ${topic}?`, a: 'Describe the misconception and explain why it is wrong.', ex: '' },
    ],
  };

  // Quiz widget — one question at a time, with a results screen
  const buildQuiz = (quiz) => {
    const uid = ++widgetUid;
    const n = quiz.questions.length;
    const LABEL = { mc: 'Multiple choice', multi: 'Select all that apply', short: 'Short answer', long: 'Long answer' };
    const HINT = { mc: 'Select one answer.', multi: 'Select every answer that applies.', short: 'Type a short answer.', long: 'Write a few sentences in your own words.' };
    const LETTERS = 'ABCDEFGH';
    let cur = 0, checked = false, results = [];
    const el = document.createElement('div');
    el.className = 'widget quiz';
    el.innerHTML = `
      <div class="w-head"><div class="w-title">${esc(quiz.title)}</div><div class="w-head-r"><span class="qz-count" aria-live="polite"></span></div></div>
      <div class="fc-progress" style="grid-template-columns: repeat(${n}, 1fr)">${quiz.questions.map(() => '<span class="seg"></span>').join('')}</div>
      ${quiz.questions.map((q, i) => {
        const qid = `q${uid}-${i}`;
        let body = '';
        if (q.type === 'mc' || q.type === 'multi') {
          body = `<div class="opts" role="${q.type === 'mc' ? 'radiogroup' : 'group'}" aria-labelledby="${qid}">` +
            q.options.map((o, j) => `<label class="opt"><input type="${q.type === 'mc' ? 'radio' : 'checkbox'}" name="${qid}" value="${j}">` +
              `<span class="opt-body"><span class="opt-name">Option ${LETTERS[j]}<span class="opt-sel"> (Selected)</span></span><span class="opt-text">${esc(o)}</span></span><span class="tag"></span></label>`).join('') +
            '</div>';
        } else if (q.type === 'short') {
          body = `<input class="ans-input" type="text" placeholder="Type your answer" aria-labelledby="${qid}">`;
        } else {
          body = `<textarea class="ans-input" rows="5" placeholder="Write your answer…" aria-labelledby="${qid}"></textarea>`;
        }
        const code = q.code ? `<div class="q-code"><div class="q-code-head"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>${esc(q.code.file)}</span><span class="q-lang">${esc(q.code.lang)}</span></div><pre><code>${highlight(q.code.src)}</code></pre></div>` : '';
        return `<section class="q" data-i="${i}"${i ? ' hidden' : ''}><div class="q-label">Question ${i + 1} · ${LABEL[q.type]}</div><h4 class="q-text" id="${qid}">${esc(q.q)}</h4><p class="q-hint">${esc(q.hint || HINT[q.type])}</p>${code}${body}<div class="feedback" hidden></div></section>`;
      }).join('')}
      <section class="qz-results" hidden></section>
      <div class="qz-foot">
        <button type="button" class="nav-btn qz-prev">${W_ICON.prev}<span>Previous Question</span></button>
        <span class="w-status"></span>
        <button type="button" class="nav-btn primary qz-next"><span>Next Question</span>${W_ICON.next}</button>
      </div>`;
    $('.w-head-r', el).appendChild(saveButton('Save quiz', 'Saved to notes', `Saved “${quiz.title}” to Notes`));

    const sections = $$('.q', el), resultsEl = $('.qz-results', el), foot = $('.qz-foot', el);
    const prev = $('.qz-prev', el), next = $('.qz-next', el), status = $('.w-status', el);
    const answered = (sec) => $$('input:checked', sec).length > 0 || $$('.ans-input', sec).some(t => t.value.trim());
    const score = () => results.filter(Boolean).length;
    const refresh = () => {
      $$('.opt', el).forEach(l => l.classList.toggle('sel', $('input', l).checked));
      status.innerHTML = checked ? `Score: <b>${score()} / ${n}</b>` : `${sections.filter(answered).length} of ${n} answered`;
    };
    const show = (i, focus) => {
      cur = i;
      resultsEl.hidden = true; foot.hidden = false;
      sections.forEach((s, j) => { s.hidden = j !== i; });
      $$('.seg', el).forEach((s, j) => s.classList.toggle('on', j <= i));
      $('.qz-count', el).textContent = `Question ${i + 1} of ${n}`;
      prev.disabled = i === 0;
      $('span', next).textContent = i < n - 1 ? 'Next Question' : checked ? 'See results' : 'Check answers';
      refresh();
      if (focus) $('.q-text', sections[i]).setAttribute('tabindex', '-1'), $('.q-text', sections[i]).focus({ preventScroll: true });
      sections[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };
    el.addEventListener('input', refresh);
    el.addEventListener('change', refresh);

    const grade = () => {
      results = quiz.questions.map((q, i) => {
        const sec = sections[i], fb = $('.feedback', sec);
        let ok = false, html = '', info = false;
        if (q.type === 'mc' || q.type === 'multi') {
          const picked = $$('input', sec).filter(x => x.checked).map(x => +x.value);
          ok = picked.length === q.answer.length && picked.every(v => q.answer.includes(v));
          $$('.opt', sec).forEach((lab, j) => {
            const isAns = q.answer.includes(j), isPicked = picked.includes(j);
            if (isAns) { lab.classList.add('correct'); $('.tag', lab).textContent = isPicked ? '✓ Correct' : 'Correct answer'; }
            else if (isPicked) { lab.classList.add('wrong'); $('.tag', lab).textContent = '✕ Your answer'; }
          });
          html = `<b>${ok ? 'Correct.' : picked.length ? 'Not quite.' : 'Not answered.'}</b> ${inline(q.why)}`;
        } else if (q.type === 'short') {
          const v = $('.ans-input', sec).value.trim().toLowerCase();
          if (q.keywords.length) {
            ok = !!v && q.keywords.every(k => v.includes(k));
            html = ok ? `<b>Correct.</b> ${esc(q.model)}.` : `<b>${v ? 'Not quite.' : 'Not answered.'}</b> The answer is “${esc(q.model)}”.`;
          } else {
            ok = !!v; info = true;
            html = ok ? `<b>Submitted.</b> ${esc(q.model)}` : `<b>Not answered.</b> ${esc(q.model)}`;
          }
        } else {
          const v = $('.ans-input', sec).value.toLowerCase();
          const hits = q.rubric.map(r => r.kw.some(k => v.includes(k)));
          const count = hits.filter(Boolean).length;
          ok = count >= 3;
          html = `<b>${v.trim() ? `Rubric: ${count} of ${q.rubric.length}` : 'Not answered.'}</b>` +
            `<ul>${q.rubric.map((r, k) => `<li>${hits[k] ? '✓' : '○'} ${esc(r.label)}</li>`).join('')}</ul>`;
        }
        fb.className = `feedback ${info ? 'info' : ok ? 'ok' : 'bad'}`;
        fb.innerHTML = html;
        fb.hidden = false;
        return ok;
      });
      $$('input, textarea', el).forEach(x => { x.disabled = true; });
      checked = true;
      el.classList.add('checked');
      toast(`You scored ${score()} out of ${n}`);
    };
    const showResults = () => {
      sections.forEach(s => { s.hidden = true; });
      foot.hidden = true;
      $$('.seg', el).forEach(s => s.classList.add('on'));
      $('.qz-count', el).textContent = 'Results';
      const s = score();
      const msg = s === n ? 'Perfect score. Nice work!' : s >= n - 1 ? 'Great job. Review the one you missed.' : s >= n / 2 ? 'Good start. Review the ones you missed, then retake.' : 'Keep going. Review each answer, then try again.';
      resultsEl.innerHTML = `
        <div class="qz-score"><div class="qz-big">${s}<span>/ ${n}</span></div><p>${msg}</p></div>
        <ol class="qz-list">${quiz.questions.map((q, i) => `<li><button type="button" class="qz-item" data-i="${i}">
          <span class="qz-mark ${results[i] ? 'ok' : 'bad'}" aria-hidden="true">${results[i] ? '✓' : '✕'}</span>
          <span class="t">${esc(q.q)}</span><small>${results[i] ? 'Correct' : 'Review'} · Q${i + 1}</small></button></li>`).join('')}</ol>
        <div class="row-btns"><button type="button" class="nav-btn qz-review">Review answers</button><button type="button" class="nav-btn primary qz-retake">Retake quiz</button></div>`;
      resultsEl.hidden = false;
      resultsEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };
    const retake = () => {
      $$('input, textarea', el).forEach(x => { x.disabled = false; if (x.type === 'radio' || x.type === 'checkbox') x.checked = false; else x.value = ''; });
      $$('.opt', el).forEach(l => { l.classList.remove('correct', 'wrong', 'sel'); $('.tag', l).textContent = ''; });
      $$('.feedback', el).forEach(f => { f.hidden = true; f.className = 'feedback'; f.innerHTML = ''; });
      checked = false; results = [];
      el.classList.remove('checked');
      show(0, true);
    };
    prev.addEventListener('click', () => { if (cur > 0) show(cur - 1, true); });
    next.addEventListener('click', () => {
      if (cur < n - 1) { show(cur + 1, true); return; }
      if (!checked) grade();
      showResults();
    });
    resultsEl.addEventListener('click', (e) => {
      const item = e.target.closest('.qz-item');
      if (item) { show(+item.dataset.i, true); return; }
      if (e.target.closest('.qz-review')) { show(0, true); return; }
      if (e.target.closest('.qz-retake')) retake();
    });
    show(0, false);
    return el;
  };

  // Flashcards widget
  const buildFlash = (set, topic) => {
    const n = set.cards.length;
    let i = 0;
    const revealed = new Set();
    const el = document.createElement('div');
    el.className = 'widget fc';
    el.innerHTML = `
      <div class="w-head"><div class="w-title">${esc(set.title)}</div><div class="w-head-r"><span class="fc-count" aria-live="polite"></span></div></div>
      <div class="fc-progress" style="grid-template-columns: repeat(${n}, 1fr)">${set.cards.map(() => '<span class="seg"></span>').join('')}</div>
      <div class="fc-stage">
        <div class="fc-card" role="button" tabindex="0">
          <div class="fc-face fc-front"></div>
          <div class="fc-face fc-back"></div>
        </div>
        <div class="fc-done" hidden></div>
      </div>
      <div class="fc-foot">
        <button type="button" class="nav-btn fc-prev">${W_ICON.prev}<span>Previous Card</span></button>
        <span class="fc-rev"></span>
        <button type="button" class="nav-btn primary fc-next"><span>Next Card</span>${W_ICON.next}</button>
      </div>`;
    $('.w-head-r', el).appendChild(saveButton('Save flashcards', 'Saved to notes', `Saved “${set.title}” to Notes`));
    const card = $('.fc-card', el), front = $('.fc-front', el), back = $('.fc-back', el), done = $('.fc-done', el);
    const prev = $('.fc-prev', el), next = $('.fc-next', el);

    const counts = () => {
      $('.fc-rev', el).textContent = `${revealed.size} / ${n} revealed`;
    };
    const show = (animate) => {
      done.hidden = true; card.hidden = false;
      card.style.transition = 'none';
      card.classList.remove('flipped');
      void card.offsetWidth;
      card.style.transition = '';
      const c = set.cards[i];
      front.innerHTML = `${W_ICON.brain}<div class="fc-kicker">Question</div><div class="fc-q">${esc(c.q)}</div><div class="fc-hint">${W_ICON.flip}Tap to flip</div>`;
      back.innerHTML = `<div class="fc-kicker">Answer</div><div class="fc-a">${esc(c.a)}</div>${c.ex ? `<div class="fc-ex">Example: ${esc(c.ex)}</div>` : ''}<div class="fc-hint">${W_ICON.flip}Tap to flip back</div>`;
      front.setAttribute('aria-hidden', 'false'); back.setAttribute('aria-hidden', 'true');
      card.setAttribute('aria-label', `Card ${i + 1} of ${n}. Question: ${c.q}. Press Enter to flip.`);
      $('.fc-count', el).textContent = `${i + 1} of ${n}`;
      $$('.seg', el).forEach((s, j) => s.classList.toggle('on', j <= i));
      prev.disabled = i === 0;
      $('span', next).textContent = i === n - 1 ? 'Finish' : 'Next Card';
      counts();
      if (animate) { card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter'); }
    };
    const flip = () => {
      const on = card.classList.toggle('flipped');
      front.setAttribute('aria-hidden', String(on)); back.setAttribute('aria-hidden', String(!on));
      card.setAttribute('aria-label', on ? `Answer: ${set.cards[i].a}. Press Enter to flip back.` : `Question: ${set.cards[i].q}. Press Enter to flip.`);
      if (on) { revealed.add(i); counts(); }
    };
    const finish = () => {
      card.hidden = true; done.hidden = false;
      $('.fc-count', el).textContent = `${n} of ${n}`;
      $('span', next).textContent = 'Finish';
      done.innerHTML = `<h4>Nice work!</h4><p>You reviewed all ${n} cards and revealed ${revealed.size}.</p>
        <div class="row-btns"><button type="button" class="nav-btn fc-again">${W_ICON.flip}<span>Review again</span></button><button type="button" class="nav-btn primary fc-quiz"><span>Quiz me on these</span></button></div>`;
      $('.fc-again', done).addEventListener('click', () => { i = 0; revealed.clear(); show(true); card.focus(); });
      $('.fc-quiz', done).addEventListener('click', () => fill(`Quiz me on ${isUX(topic) ? 'UX & Product Design' : topic}`));
    };
    card.addEventListener('click', flip);
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    prev.addEventListener('click', () => { if (!done.hidden) { show(true); return; } if (i > 0) { i--; show(true); } });
    next.addEventListener('click', () => { if (!done.hidden) return; if (i < n - 1) { i++; show(true); } else finish(); });
    el.addEventListener('keydown', (e) => {
      if (e.target.closest('input, textarea')) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); next.click(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prev.click(); }
    });
    show(false);
    return el;
  };

  // Canned answers (demo only — no model is connected)
  const COURSE_SOURCES = [
    { ic: 'L4', t: 'Lecture 4 — Slides', s: 'Course materials · slides 12–15' },
    { ic: 'SG', t: 'Unit 2 study guide', s: 'Course materials · p. 3' },
    { ic: 'N', t: 'Your notes: Week 3', s: 'Library · your notes' },
  ];
  const replyFor = (q) => {

  ].join('\n');
  const LESSON_SOURCES = [
    { ic: 'Py', t: 'Python docs: variables', s: 'Reference documentation' },
    { ic: 'N', t: 'Your notes: Week 3', s: 'Library · your notes' },
  ];
  const plain = (md) => md
    .replace(/\[([^\]]+)\]\(src:\d+\)/g, '')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\s+·\s*$/g, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
  const voicePlan = (q) => {
    const t = q.toLowerCase().replace(/[^\w\s']/g, ' ').replace(/\s+/g, ' ').trim();
    const words = t.split(' ').length;
    if (/^(hi|hey|hello|hiya|good (morning|afternoon|evening))\b/.test(t) && words <= 4)
      return { say: 'Hey! What would you like to study today?' };
    if (/\b(thanks|thank you|cheers)\b/.test(t))
      return { say: "You're welcome. Want to keep going, or try a quick quiz on what we covered?" };
    if (/\bflashcards?\b/.test(t) || /\bquiz\b/.test(t)) {
      const r = replyFor(q);
      return { say: plain(r.md), widget: r.widget, widgetLabel: r.widgetLabel, after: r.outro, sources: r.sources };
    }
    if (/\b(vs ?code|show me|how (it|that|this) (looks|would look)|example|examples|what it looks like)\b/.test(t))
      return { say: "Right. I'll walk you through it. Imagine you've opened VS Code.", md: LESSON_MD, sources: LESSON_SOURCES };
    if (/\b(teach|python 101|basics|theory|variables?|start)\b/.test(t) && /\b(python|teach|101|theory|variables?|basics|coding|programming)\b/.test(t))
      return { say: "Okay, let's do it. Think of Python as a set of instructions you give the computer. The first concept is variables. They're just names you give to values, like name equals Ava, or age equals 25. Want me to show you how that looks in VS Code?" };
    if (/\b(learn|study|get into)\b/.test(t) && /\b(python|coding|programming|development|code)\b/.test(t))
      return { say: 'Nice. Do you want to start with the theory, or with something you can build right away?' };
    const r = replyFor(q);
    const paras = r.md.split(/\n\s*\n/);
    return { say: plain(paras[0]), md: paras.slice(1).join('\n\n'), sources: r.sources };
  };

  // Speak a line and reveal its words in sync (word boundaries when the voice reports them)
  const sayInto = (p, text, turn) => new Promise((resolve) => {
    const words = text.split(/\s+/).filter(Boolean);
    let shown = 0, boundaries = false, settled = false, timer = 0;
    const showUpTo = (n) => {
      while (shown < Math.min(n, words.length)) {
        const s = document.createElement('span');
        s.className = 'w fresh';
        s.textContent = (shown ? ' ' : '') + words[shown];
        p.appendChild(s);
        setTimeout(() => s.classList.remove('fresh'), 380);
        shown++;
      }
      keepBottom();
    };
    const finish = (completed) => {
      if (settled) return;
      settled = true;
      clearInterval(timer);
      if (completed) showUpTo(words.length);
      resolve(completed);
    };
    if (canSpeak) {
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.03;
      u.lang = navigator.language || 'en-US';
      u.onboundary = (ev) => {
        if (ev.name && ev.name !== 'word') return;
        boundaries = true;
        showUpTo(text.slice(0, ev.charIndex).split(/\s+/).filter(Boolean).length + 1);
      };
      u.onend = () => finish(turn === vTurn);
      u.onerror = () => finish(turn === vTurn);
      hush();
      window.speechSynthesis.speak(u);
      let started = false;
      timer = setInterval(() => {
        if (turn !== vTurn) { finish(false); return; }
        const busySpeaking = window.speechSynthesis.speaking || window.speechSynthesis.pending;
        if (busySpeaking) started = true;
        if (!boundaries) showUpTo(shown + 1);
        if (shown >= words.length && (started || !busySpeaking) && !busySpeaking) finish(true);
      }, 300);
    } else {
      timer = setInterval(() => {
        if (turn !== vTurn) { finish(false); return; }
        showUpTo(shown + 1);
        if (shown >= words.length) finish(true);
      }, 260);
    }
  });

  const resumeListening = () => {
    if (!vActive) return;
    if (!SR) { setOrb('unsupported'); return; }
    if (recogBlocked) { setOrb('denied'); return; }
    if (vMuted) { setOrb('muted'); return; }
    setOrb('listening');
    startRecog();
  };

  const voiceAnswer = async (q) => {
    const turn = ++vTurn;
    stopFlag = false;
    setOrb('thinking');
    const plan = voicePlan(q);
    const ai = addMsg('ai spoken', '<div class="shimmer">Thinking</div><div class="body spoken-body"><p></p></div>');
    ai.dataset.q = q;
    keepBottom();
    await wait(plan.md || plan.widget ? 900 : 500);
    if (turn !== vTurn) return;
    $('.shimmer', ai)?.remove();
    setOrb('speaking');
    const completed = await sayInto($('.spoken-body p', ai), plan.say, turn);
    if (!completed || turn !== vTurn) return;
    if (plan.sources) setSources(plan.sources);
    let mdAll = plan.say;
    if (plan.md && plan.md.trim()) {
      const d = document.createElement('div');
      d.className = 'body lesson';
      ai.appendChild(d);
      await stream(d, plan.md);
      mdAll += `\n\n${plan.md}`;
    }
    if (turn !== vTurn) return;
    if (plan.widget) {
      const slot = document.createElement('div');
      slot.className = 'widget-slot';
      slot.appendChild(plan.widget());
      ai.appendChild(slot);
      if (plan.after) {
        const d = document.createElement('div');
        d.className = 'body body2';
        d.innerHTML = render(plan.after);
        ai.appendChild(d);
        mdAll += `\n\n${plan.after}`;
      }
    }
    ai.dataset.md = mdAll;
    if (plan.md || plan.widget) {
      ai.insertAdjacentHTML('beforeend', `<div class="actions">
        <button type="button" class="act" data-act="save">${ICON.note}<span>Save to notes</span></button>
        <button type="button" class="act" data-act="copy">${ICON.copy}<span>Copy</span></button></div>`);
    }
    keepBottom();
    resumeListening();
  };

  // Tap the orb to interrupt Aurora (barge-in)
  const interrupt = () => {
    if (vState !== 'speaking' && vState !== 'thinking') return;
    vTurn++;
    hush();
    stopFlag = true;
    const last = [...$$('.msg.ai.spoken', inner)].pop();
    if (last) {
      $('.shimmer', last)?.remove();
      $$('.w.fresh', last).forEach(w => w.classList.remove('fresh'));
      const p = $('.spoken-body p', last);
      if (p && !$('.cut-note', last)) p.insertAdjacentHTML('beforeend', '<span class="cut-note">Interrupted</span>');
    }
    resumeListening();
  };
  orb.addEventListener('click', interrupt);

  const startVoice = async () => {
    if (busy) stopFlag = true;
    $$('.card').forEach(c => c.classList.remove('selected'));
    enterChat();
    document.body.classList.add('voice');
    vActive = true;
    vMuted = false;
    recogBlocked = false;
    muteBtn.setAttribute('aria-pressed', 'false');
    prompt.placeholder = 'Type';
    if (!SR) { setOrb('unsupported'); return; }
    setOrb('listening');
    const level = await startLevel();          // asks for microphone permission
    if (!vActive) { stopLevel(); return; }
    if (level === 'denied') { recogBlocked = true; setOrb('denied'); return; }
    resumeListening();
  };
  const endVoice = (silent) => {
    vActive = false;
    vTurn++;
    hush();
    stopRecog();
    stopLevel();
    if (liveRow) {
      const row = liveRow, q = $('.bubble', row).textContent.trim();
      liveRow = null; finalText = '';
      if (q) sealUserRow(row, q); else row.remove();
    }
    $$('.body.live').forEach(b => b.classList.remove('live'));
    vMuted = false;
    muteBtn.setAttribute('aria-pressed', 'false');
    muteBtn.setAttribute('aria-label', 'Mute microphone');
    document.body.classList.remove('voice');
    setOrb('idle');
    prompt.placeholder = 'Ask a follow-up...';
    if (!silent) toast('Voice session ended');
  };
  // Typing while in voice mode: Aurora still answers out loud
  const typedVoiceTurn = (q) => {
    if (vState === 'speaking' || vState === 'thinking') interrupt();
    stopRecog();
    if (liveRow) { liveRow.remove(); liveRow = null; finalText = ''; }
    const row = addMsg('me-row', '<div class="bubble"></div>');
    sealUserRow(row, q);
    prompt.value = ''; autosize();
    voiceAnswer(q);
  };
  muteBtn.addEventListener('click', () => {
    vMuted = !vMuted;
    muteBtn.setAttribute('aria-pressed', String(vMuted));
    muteBtn.setAttribute('aria-label', vMuted ? 'Unmute microphone' : 'Mute microphone');
    if (vMuted) {
      stopRecog();
      if (liveRow) commitTurn();
      if (vState === 'listening' || vState === 'hearing') setOrb('muted');
    } else if (vState === 'muted') {
      resumeListening();
    }
    toast(vMuted ? 'Microphone off' : 'Microphone on');
  });
  $('#endVoice').addEventListener('click', () => endVoice(false));
  $('#micBtn').addEventListener('click', startVoice);

  const enterChat = () => document.body.classList.add('chatting');
  function exitChat() {
    if (vActive) endVoice(true);
    collapseCode();
    stopFlag = true;
    document.body.classList.remove('chatting');
    inner.innerHTML = '';
    resetSources();
    prompt.placeholder = 'Ask Aurora anything...';
    setBusy(false);
    scrollDown.classList.remove('show');
  }
  $('#back').addEventListener('click', exitChat);

  const send = async (e) => {
    e && e.preventDefault();
    if (busy) { stopFlag = true; return; }
    const q = prompt.value.trim();
    if (!q) { prompt.focus(); return; }
    if (vActive) { typedVoiceTurn(q); return; }
    enterChat();
    const fileHtml = files.length ? `<div class="files">${files.map(f => `<span>📎 ${esc(f.name)}</span>`).join('')}</div>` : '';
    const row = addMsg('me-row', `<div class="bubble">${esc(q)}${fileHtml}</div><button type="button" class="act me-copy" data-act="copy-me" aria-label="Copy message" title="Copy">${ICON.copy}</button>`);
    row.querySelector('.bubble').dataset.q = q;
    files = []; renderFiles();
    prompt.value = ''; autosize();
    prompt.placeholder = 'Ask a follow-up...';
    const ai = addMsg('ai', '');
    ai.dataset.q = q;
    await respond(ai);
    prompt.focus();
  };
  $('#composer').addEventListener('submit', send);
  prompt.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) send(e);
  });
})();
</script>
</body>
</html>
